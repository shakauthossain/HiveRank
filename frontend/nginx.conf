server {
    listen 3003;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-HiveRank-Service "frontend" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-HiveRank-Service "frontend" always;
    }
}
