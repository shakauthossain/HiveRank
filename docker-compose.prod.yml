# Production stack for the VPS (nginx frontend + API, no Vite).
# On the server:
#   cd ~/NH-SEO
#   docker compose -f docker-compose.prod.yml down
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Frontend: http://SERVER_IP:3003
# API docs:  http://SERVER_IP:8003/docs

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seo_backend
    ports:
      - "8003:8003"
    env_file:
      - ./backend/.env
    environment:
      BASE_URL: https://seo-api.riseo.online
    volumes:
      - ./backend/reports:/app/reports
    restart: unless-stopped
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8003"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://seo-api.riseo.online
        VITE_APP_TITLE: HiveRank
    container_name: seo_frontend
    ports:
      - "3003:3003"
    depends_on:
      - backend
    restart: unless-stopped
